<body>
    <header class="cabecalho">
        <img class="logo" src="img/logo.svg" alt="Logo do X-men">
    </header>
    <main class="selecao-de-personagens">
        <section class="personagens">
            <h1 class="titulo">Selecione um personagem</h1>
            <ul class="lista-de-personagens">
                <li class="personagem selecionado" id="ciclope" data-name="Ciclope" 
                data-description="Ele tem o poder de diparar rajadas ópticas por uma acidente com ele
                quando criança, mas não consegue controlá-los">
                    <img src="img/card-ciclope.jpg" alt="Personagem Ciclope">
                </li>
                <li class="personagem" id="jean-grey" data-name="jean-grey" 
                data-description="Jean Grey é uma mutante nível ômega e o princiapl avatar da
                força Fenix, no qual menifesta poderes cósmicos. A telepatia e telecinese">
                    <img src="img/card-jean-grey.jpg" alt="Personagem jean-grey">
                </li>
                <li class="personagem" id="lince-negra" data-name="lince-negra" 
                data-description="Ela tem o poder de atravessar matéria sólida, campos de energia, rajadas ópticas,
                continuando intacta, e também tem o poder de andar no ar">
                    <img src="img/card-lince-negra.jpg" alt="Personagem lince-negra">
                </li>
                <li class="personagem" id="tempestade" data-name="tempestade" 
                data-description="Tem o poder de controlar as forças da natureza, muito poderosa ela produzir
                raios, chuvas, gelos, ventos, neblina, entre outros efeitos">
                    <img src="img/card-tempestade.jpg" alt="Personagem tempestade">
                </li>
                <li class="personagem" id="vampira" data-name="vampira" 
                data-description="Ela tem o poder de absorver a vitalidade e a memória das pessoas que 
                toca ou no caso mutantes,os poderes e a memória,só que temporariamente">
                    <img src="img/card-vampira.jpg" alt="Personagem vampira">
                </li>
                <li class="personagem" id="wolverine" data-name="wolverine" 
                data-description="Poderes: Garras de Adamantium.Fator de cura regenerativo,super
                agilidade">
                    <img src="img/card-wolverine.jpg" alt="Personagem wolverine">
                </li>
                <li class="personagem" id="noturno" data-name="noturno" 
                data-description="Ele é um mutante que nasceu com calda,orelhas pontudas e com
                poder de se teletransportar">
                    <img src="img/card-noturno.jpg" alt="Personagem noturno">
                </li>
                <li class="personagem" id="magneto" data-name="magneto" 
                data-description="Ele tem o poder de magnetocinese,ou seja,controlar objetos metálicos
                e criar campos magnéticos">
                    <img src="img/card-magneto.jpg" alt="Personagem magneto">
                </li>
            </ul>
        </section>
        <section class="personagem-selecionado">
            <img  class="personagem-grande" src="img/card-ciclope.png" alt="personagem selecionado">
            <div class="informacoes-personagem">
                <h1 class="nome-personagem" id="nome-personagem">Ciclope</h1>
                <p class="descricao-personagem"id="descricao-personagem">
                   Ele tem o poder de diparar rajadas ópticas por uma acidente com ele
                quando criança, mas não consegue controlá-los 
                </p>

            </div>
        </section>
    </main>
</body>
</html>
